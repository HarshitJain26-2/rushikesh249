name: Generate GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: rushikesh249
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          config_display: block
          config_padding: 2cm
          config_animations: yes
          config_time: yes
          config_utc: no
          config_presets: yes
          config_presets_color: light
          config_presets_theme: midnight-purple
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_other: no
          plugin_languages_colors: github
          plugin_languages_sections: most-used
          plugin_languages_indepth: no
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_recent_load: 300
          plugin_languages_analysis_recent_days: 14
          plugin_followup: yes
          plugin_followup_sections: repositories
          plugin_followup_limit: 5
          plugin_notable: yes
          plugin_notable_from: organization
          plugin_notable_types: commit
          plugin_notable_limit: 5
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: detailed
          plugin_achievements_limit: 4
          plugin_streak: yes
          plugin_streak_limit: 365
          plugin_habits: yes
          plugin_habits_from: 2004
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_introduction: yes
          plugin_introduction_title: yes
          plugin_introduction_text: yes
          plugin_introduction_base: header, repositories

      - name: Commit and push metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: update GitHub metrics [skip ci]"
          git push
