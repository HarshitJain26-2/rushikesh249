<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-label="Rushikesh Ambhore  AI Engineer  Building AI Infrastructure">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="50%" stop-color="#0D1B2A"/>
      <stop offset="100%" stop-color="#112240"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64FFDA" stop-opacity="0"/>
      <stop offset="50%" stop-color="#64FFDA" stop-opacity="1"/>
      <stop offset="100%" stop-color="#64FFDA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="purpleAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BD93F9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#BD93F9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#233554" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#112240" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="nodeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#233554" stroke-width="0.5" opacity="0.4"/>
    </pattern>
    <clipPath id="bannerClip">
      <rect x="0" y="0" width="1200" height="320" rx="12"/>
    </clipPath>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; fill: #E6F1FF; font-weight: 700; }
    .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; fill: #64FFDA; font-weight: 500; }
    .tagline { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; fill: #8892B0; font-weight: 400; }
    .mono { font-family: 'Consolas', 'Courier New', monospace; fill: #BD93F9; font-size: 11px; }
  </style>

  <g clip-path="url(#bannerClip)">
    <!-- Background -->
    <rect width="1200" height="320" fill="url(#bgGrad)"/>

    <!-- Animated grid -->
    <g opacity="0.55">
      <rect width="1200" height="320" fill="url(#gridPattern)">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="40 40" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect width="1200" height="320" fill="url(#gridPattern)" opacity="0.3">
        <animateTransform attributeName="transform" type="translate" from="40 40" to="0 0" dur="12s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Neural network layer -->
    <g opacity="0.35" filter="url(#nodeGlow)">
      <!-- Connections -->
      <line x1="80" y1="60" x2="180" y2="120" stroke="#64FFDA" stroke-width="0.8" opacity="0.5">
        <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
      </line>
      <line x1="80" y1="180" x2="180" y2="120" stroke="#64FFDA" stroke-width="0.8" opacity="0.5">
        <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite"/>
      </line>
      <line x1="80" y1="240" x2="180" y2="200" stroke="#BD93F9" stroke-width="0.8" opacity="0.4">
        <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3.5s" repeatCount="indefinite"/>
      </line>
      <line x1="180" y1="120" x2="280" y2="160" stroke="#64FFDA" stroke-width="0.8" opacity="0.5"/>
      <line x1="180" y1="200" x2="280" y2="160" stroke="#BD93F9" stroke-width="0.8" opacity="0.4"/>
      <line x1="280" y1="160" x2="380" y2="100" stroke="#64FFDA" stroke-width="0.8" opacity="0.5"/>
      <line x1="280" y1="160" x2="380" y2="220" stroke="#64FFDA" stroke-width="0.8" opacity="0.5"/>

      <!-- Right side network -->
      <line x1="820" y1="80" x2="920" y2="140" stroke="#64FFDA" stroke-width="0.8" opacity="0.4"/>
      <line x1="820" y1="200" x2="920" y2="140" stroke="#BD93F9" stroke-width="0.8" opacity="0.4"/>
      <line x1="920" y1="140" x2="1020" y2="100" stroke="#64FFDA" stroke-width="0.8" opacity="0.5"/>
      <line x1="920" y1="140" x2="1020" y2="180" stroke="#64FFDA" stroke-width="0.8" opacity="0.5"/>
      <line x1="1020" y1="100" x2="1100" y2="160" stroke="#BD93F9" stroke-width="0.8" opacity="0.4"/>
      <line x1="1020" y1="180" x2="1100" y2="160" stroke="#64FFDA" stroke-width="0.8" opacity="0.4"/>

      <!-- Nodes left -->
      <circle cx="80" cy="60" r="4" fill="#64FFDA"><animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="80" cy="180" r="4" fill="#64FFDA"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="80" cy="240" r="3" fill="#BD93F9"/>
      <circle cx="180" cy="120" r="5" fill="#64FFDA" filter="url(#softGlow)"/>
      <circle cx="180" cy="200" r="4" fill="#BD93F9"/>
      <circle cx="280" cy="160" r="6" fill="#64FFDA" filter="url(#softGlow)">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="380" cy="100" r="3" fill="#64FFDA"/>
      <circle cx="380" cy="220" r="3" fill="#BD93F9"/>

      <!-- Nodes right -->
      <circle cx="820" cy="80" r="4" fill="#64FFDA"/>
      <circle cx="820" cy="200" r="4" fill="#BD93F9"/>
      <circle cx="920" cy="140" r="5" fill="#64FFDA" filter="url(#softGlow)"/>
      <circle cx="1020" cy="100" r="3" fill="#64FFDA"/>
      <circle cx="1020" cy="180" r="3" fill="#BD93F9"/>
      <circle cx="1100" cy="160" r="4" fill="#64FFDA">
        <animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Floating particles -->
    <circle cx="150" cy="280" r="1.5" fill="#64FFDA" opacity="0.6">
      <animate attributeName="cy" values="280;240;280" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="50" r="1" fill="#BD93F9" opacity="0.5">
      <animate attributeName="cy" values="50;90;50" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="450;470;450" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="270" r="1.5" fill="#64FFDA" opacity="0.5">
      <animate attributeName="cy" values="270;230;270" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="950" cy="40" r="1" fill="#64FFDA" opacity="0.4">
      <animate attributeName="cy" values="40;70;40" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="280" r="1.2" fill="#BD93F9" opacity="0.5">
      <animate attributeName="cy" values="280;250;280" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="30" r="0.8" fill="#64FFDA" opacity="0.3">
      <animate attributeName="cy" values="30;55;30" dur="6.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="290" r="1" fill="#BD93F9" opacity="0.4">
      <animate attributeName="cx" values="320;340;320" dur="9s" repeatCount="indefinite"/>
    </circle>

    <!-- Scan line -->
    <rect x="0" y="0" width="1200" height="2" fill="url(#cyanGlow)" opacity="0.35">
      <animate attributeName="y" values="0;320;0" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- Glass panel -->
    <rect x="300" y="60" width="600" height="200" rx="16" fill="url(#glassFill)" stroke="#233554" stroke-width="1"/>
    <rect x="300" y="60" width="600" height="200" rx="16" fill="none" stroke="#64FFDA" stroke-width="0.5" opacity="0.3">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- Top accent line -->
    <rect x="300" y="60" width="600" height="2" rx="1" fill="url(#purpleAccent)"/>

    <!-- Status indicator -->
    <circle cx="330" cy="88" r="4" fill="#64FFDA">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="345" y="92" class="mono">neural-core :: online</text>

    <!-- Main typography -->
    <text x="600" y="145" text-anchor="middle" class="title" font-size="36" filter="url(#softGlow)">Rushikesh Ambhore</text>
    <text x="600" y="178" text-anchor="middle" class="subtitle" font-size="18">AI Engineer</text>
    <text x="600" y="210" text-anchor="middle" class="tagline" font-size="14">Building AI Infrastructure &amp; Intelligent Systems</text>

    <!-- Typing cursor -->
    <rect x="838" y="198" width="2" height="16" fill="#64FFDA">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- Location badge -->
    <rect x="490" y="228" width="220" height="24" rx="12" fill="#112240" stroke="#233554" stroke-width="0.5" opacity="0.8"/>
    <text x="600" y="244" text-anchor="middle" class="tagline" font-size="11">India � Generative AI � RAG � AI Agents</text>

    <!-- Border glow -->
    <rect x="1" y="1" width="1198" height="318" rx="12" fill="none" stroke="#233554" stroke-width="1"/>
    <rect x="1" y="1" width="1198" height="318" rx="12" fill="none" stroke="#64FFDA" stroke-width="0.5" opacity="0.15">
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
