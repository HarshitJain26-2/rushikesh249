<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" role="img" aria-label="Terminal profile  Rushikesh Ambhore">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#112240"/>
    </linearGradient>
    <linearGradient id="termGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#233554" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0A192F" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="termGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="termClip">
      <rect x="20" y="20" width="860" height="380" rx="12"/>
    </clipPath>
  </defs>

  <style>
    .prompt { font-family: 'Consolas', 'Courier New', monospace; fill: #64FFDA; font-size: 14px; font-weight: 600; }
    .cmd { font-family: 'Consolas', 'Courier New', monospace; fill: #BD93F9; font-size: 14px; }
    .out { font-family: 'Consolas', 'Courier New', monospace; fill: #8892B0; font-size: 13px; }
    .out-highlight { font-family: 'Consolas', 'Courier New', monospace; fill: #E6F1FF; font-size: 13px; }
    .out-accent { font-family: 'Consolas', 'Courier New', monospace; fill: #64FFDA; font-size: 13px; }
    .header { font-family: 'Segoe UI', system-ui, sans-serif; fill: #8892B0; font-size: 11px; }
  </style>

  <!-- Outer frame -->
  <rect width="900" height="420" rx="14" fill="url(#termBg)" stroke="#233554" stroke-width="1"/>
  <rect width="900" height="420" rx="14" fill="none" stroke="#64FFDA" stroke-width="0.5" opacity="0.2"/>

  <!-- Title bar -->
  <rect x="20" y="20" width="860" height="36" rx="8" fill="#112240" stroke="#233554" stroke-width="0.5"/>
  <circle cx="44" cy="38" r="5" fill="#FF5F57"/>
  <circle cx="64" cy="38" r="5" fill="#FEBC2E"/>
  <circle cx="84" cy="38" r="5" fill="#28C840"/>
  <text x="450" y="42" text-anchor="middle" class="header">rushikesh@ambhore  bash  80�24</text>

  <!-- Terminal body -->
  <rect x="20" y="64" width="860" height="336" rx="8" fill="url(#termGlass)" stroke="#233554" stroke-width="0.5"/>

  <g clip-path="url(#termClip)">
    <!-- Scan line -->
    <rect x="20" y="64" width="860" height="1" fill="#64FFDA" opacity="0.15">
      <animate attributeName="y" values="64;400;64" dur="8s" repeatCount="indefinite"/>
    </rect>

    <!-- Block 1: whoami -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.01s" fill="freeze"/>
      <text x="40" y="100" class="prompt">$</text>
      <text x="56" y="100" class="cmd">whoami</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.01s" fill="freeze"/>
      <text x="40" y="122" class="out-highlight">Rushikesh Ambhore</text>
    </g>

    <!-- Block 2: role -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="3s" dur="0.01s" fill="freeze"/>
      <text x="40" y="158" class="prompt">$</text>
      <text x="56" y="158" class="cmd">role</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="4s" dur="0.01s" fill="freeze"/>
      <text x="40" y="180" class="out-accent">AI Engineer</text>
    </g>

    <!-- Block 3: focus -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="5.2s" dur="0.01s" fill="freeze"/>
      <text x="40" y="216" class="prompt">$</text>
      <text x="56" y="216" class="cmd">focus</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="6.2s" dur="0.01s" fill="freeze"/>
      <text x="40" y="238" class="out">Generative AI</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="6.8s" dur="0.01s" fill="freeze"/>
      <text x="40" y="256" class="out">RAG</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="7.2s" dur="0.01s" fill="freeze"/>
      <text x="40" y="274" class="out">AI Agents</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="7.6s" dur="0.01s" fill="freeze"/>
      <text x="40" y="292" class="out">Vector Databases</text>
    </g>

    <!-- Block 4: building -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="8.8s" dur="0.01s" fill="freeze"/>
      <text x="460" y="100" class="prompt">$</text>
      <text x="476" y="100" class="cmd">building</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="9.8s" dur="0.01s" fill="freeze"/>
      <text x="460" y="122" class="out-accent">Sovereign Neural Core</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="10.4s" dur="0.01s" fill="freeze"/>
      <text x="460" y="140" class="out">ShieldAI</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="10.8s" dur="0.01s" fill="freeze"/>
      <text x="460" y="158" class="out">CypherVault</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="11.2s" dur="0.01s" fill="freeze"/>
      <text x="460" y="176" class="out">MediQ</text>
    </g>

    <!-- Block 5: status -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="12.4s" dur="0.01s" fill="freeze"/>
      <text x="460" y="216" class="prompt">$</text>
      <text x="476" y="216" class="cmd">status</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="13.4s" dur="0.01s" fill="freeze"/>
      <text x="460" y="238" class="out-highlight">Open to AI Internship</text>
    </g>

    <!-- Active prompt line -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="14.5s" dur="0.01s" fill="freeze"/>
      <text x="40" y="340" class="prompt">$</text>
      <text x="56" y="340" class="cmd">_</text>
    </g>

    <!-- Blinking cursor -->
    <rect x="68" y="326" width="8" height="16" fill="#64FFDA" filter="url(#termGlow)">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" begin="14.5s"/>
    </rect>

    <!-- Loop restart indicator (subtle pulse on border) -->
    <rect x="20" y="64" width="860" height="336" rx="8" fill="none" stroke="#64FFDA" stroke-width="0.5" opacity="0">
      <animate attributeName="opacity" values="0;0.15;0" dur="20s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Footer status bar -->
  <rect x="20" y="388" width="860" height="12" rx="4" fill="#112240" opacity="0.6"/>
  <text x="40" y="397" class="header" font-size="9">UTF-8</text>
  <text x="820" y="397" text-anchor="end" class="header" font-size="9">Ln 1, Col 1</text>
</svg>
