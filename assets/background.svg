<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="deepBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="40%" stop-color="#0D1B2A"/>
      <stop offset="100%" stop-color="#112240"/>
    </linearGradient>
    <radialGradient id="cyanOrb" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#64FFDA" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#64FFDA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleOrb" cx="80%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#BD93F9" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#BD93F9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="fineGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#233554" stroke-width="0.4" opacity="0.35"/>
    </pattern>
    <pattern id="coarseGrid" width="128" height="128" patternUnits="userSpaceOnUse">
      <path d="M 128 0 L 0 0 0 128" fill="none" stroke="#233554" stroke-width="0.8" opacity="0.2"/>
    </pattern>
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64FFDA" stop-opacity="0"/>
      <stop offset="50%" stop-color="#64FFDA" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#64FFDA" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base -->
  <rect width="1200" height="800" fill="url(#deepBg)"/>
  <rect width="1200" height="800" fill="url(#cyanOrb)"/>
  <rect width="1200" height="800" fill="url(#purpleOrb)"/>

  <!-- Dual-layer grid -->
  <g opacity="0.6">
    <rect width="1200" height="800" fill="url(#coarseGrid)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="128 128" dur="20s" repeatCount="indefinite"/>
    </rect>
    <rect width="1200" height="800" fill="url(#fineGrid)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="32 32" dur="10s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Horizon line -->
  <line x1="0" y1="400" x2="1200" y2="400" stroke="#233554" stroke-width="0.5" opacity="0.3"/>

  <!-- Floating particles -->
  <circle cx="200" cy="150" r="1.2" fill="#64FFDA" opacity="0.4">
    <animate attributeName="cy" values="150;120;150" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="600" r="1" fill="#BD93F9" opacity="0.3">
    <animate attributeName="cy" values="600;570;600" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="200" r="1.5" fill="#64FFDA" opacity="0.35">
    <animate attributeName="cx" values="900;920;900" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1100" cy="500" r="0.8" fill="#BD93F9" opacity="0.25">
    <animate attributeName="cy" values="500;480;500" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="700" r="1" fill="#64FFDA" opacity="0.3">
    <animate attributeName="cx" values="350;370;350" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="100" r="0.9" fill="#64FFDA" opacity="0.2">
    <animate attributeName="cy" values="100;130;100" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Neural connections (ambient) -->
  <g opacity="0.15" stroke="#64FFDA" stroke-width="0.6" fill="none">
    <path d="M 100 300 Q 300 250 500 300">
      <animate attributeName="opacity" values="0.1;0.25;0.1" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M 700 500 Q 900 450 1100 500">
      <animate attributeName="opacity" values="0.08;0.2;0.08" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Scan line -->
  <rect x="0" y="0" width="1200" height="60" fill="url(#scanBeam)">
    <animate attributeName="y" values="-60;800;-60" dur="12s" repeatCount="indefinite"/>
  </rect>

  <!-- Vignette -->
  <rect width="1200" height="800" fill="url(#deepBg)" opacity="0.15"/>
  <rect x="0" y="0" width="1200" height="80" fill="#0A192F" opacity="0.3"/>
  <rect x="0" y="720" width="1200" height="80" fill="#0A192F" opacity="0.4"/>
</svg>
