<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="100%" role="img" aria-label="Rotating technology stack">
  <defs>
    <linearGradient id="stackBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="50%" stop-color="#112240"/>
      <stop offset="100%" stop-color="#0A192F"/>
    </linearGradient>
    <linearGradient id="stackGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64FFDA" stop-opacity="0"/>
      <stop offset="50%" stop-color="#64FFDA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#64FFDA" stop-opacity="0"/>
    </linearGradient>
    <filter id="stackBlur">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .label { font-family: 'Consolas', 'Courier New', monospace; fill: #8892B0; font-size: 11px; letter-spacing: 2px; }
    .tech { font-family: 'Segoe UI', system-ui, sans-serif; fill: #E6F1FF; font-size: 28px; font-weight: 600; }
    .tech-accent { font-family: 'Segoe UI', system-ui, sans-serif; fill: #64FFDA; font-size: 28px; font-weight: 600; }
    .tech-purple { font-family: 'Segoe UI', system-ui, sans-serif; fill: #BD93F9; font-size: 28px; font-weight: 600; }
  </style>

  <rect width="900" height="120" rx="12" fill="url(#stackBg)" stroke="#233554" stroke-width="1"/>
  <rect width="900" height="120" rx="12" fill="none" stroke="#64FFDA" stroke-width="0.5" opacity="0.15"/>
  <rect x="0" y="58" width="900" height="1" fill="url(#stackGlow)" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite"/>
  </rect>

